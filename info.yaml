# Tiny Tapeout project information
project:
  title:        "Programmable Protocol Emulator (M1 baseline)"
  author:       "TBD before submission"
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Firmware-loaded GPIO sequencer for protocol experiments"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000 # design target; physical timing not yet verified

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Jane Street allocation; precheck pending

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_ppe_demo" # provisional until repository owner is known

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Host nibble bit 0"
  ui[1]: "Host nibble bit 1"
  ui[2]: "Host nibble bit 2"
  ui[3]: "Host nibble bit 3"
  ui[4]: "Host command bit 0"
  ui[5]: "Host command bit 1"
  ui[6]: "Host command bit 2"
  ui[7]: "Host request toggle"

  # Outputs
  uo[0]: "PC bit 0"
  uo[1]: "PC bit 1"
  uo[2]: "PC bit 2"
  uo[3]: "PC bit 3"
  uo[4]: "Loader full"
  uo[5]: "Error"
  uo[6]: "Running"
  uo[7]: "Host ack toggle"

  # Bidirectional pins
  uio[0]: "Firmware GPIO 0"
  uio[1]: "Firmware GPIO 1"
  uio[2]: "Firmware GPIO 2"
  uio[3]: "Firmware GPIO 3"
  uio[4]: "Firmware GPIO 4"
  uio[5]: "Firmware GPIO 5"
  uio[6]: "Firmware GPIO 6"
  uio[7]: "Firmware GPIO 7"

# Do not change!
yaml_version: 6
